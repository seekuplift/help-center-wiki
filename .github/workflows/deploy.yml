# Build the wiki with MkDocs and publish to GitHub Pages.
#
# This workflow is committed as the deploy PIPELINE for ticket HC-2. Per the
# operator scope override, it is NEVER executed by an agent: the human performs
# the deploy. It is kept here so the build+deploy path is reproducible and
# documented in version control, not just in README.md.
#
# Pages target: this repo's own GitHub Pages site. The workflow:
#   1. Installs the pinned mkdocs + mkdocs-material from requirements.txt.
#   2. Runs `mkdocs build` to produce site/.
#   3. Reindexes Algolia from docs/*.md when secrets.ALGOLIA_WRITE_API_KEY
#      is set; otherwise skips indexing and still deploys Pages.
#   4. Uploads site/ as the Pages artifact and deploys it.
#
# Algolia secrets (repo Settings → Secrets → Actions):
#   ALGOLIA_APP_ID, ALGOLIA_WRITE_API_KEY
# Do not store the DeepSeek key or the search-only key here. Operator
# checklist: README.md "Algolia search and Ask AI — deployment".
#
# Before first run, GitHub repo Settings → Pages → "Build and deployment"
# → Source must be set to "GitHub Actions".

name: Build and deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-flight runs on the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict --clean

      - name: Index wiki in Algolia
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_WRITE_API_KEY }}
        run: |
          if [ -z "$ALGOLIA_WRITE_API_KEY" ]; then
            echo "Skipping Algolia index (ALGOLIA_WRITE_API_KEY secret not set)."
            exit 0
          fi
          python scripts/index_algolia.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
