# MkDocs configuration for the Seek Uplift help-center wiki.
#
# Material theme plus a SeekUplift brand layer (dark navy, sprout teal,
# Space Grotesk / DM Sans, Token Sprout logo). No project JavaScript.
# Analytics and cookie-consent plugins stay OFF: the wiki is rendered
# inside the app's incognito WebView, where anything that touches browser
# storage misbehaves.
#
# Ticket HC-2 (redesign/launchpad-mobile-redesign/tickets-help-center.md).
# Design spec: docs/superpowers/specs/2026-08-27-in-app-help-center-design.md
#   section 2 "Wiki". Brand tokens: brand/SEEKUPLIFT_DESIGN_SYSTEM.md.

site_name: Seek Uplift
site_description: PUBLIC TEST help-center wiki for Seek Uplift — not production; no promises.
# Public test Pages URL under the corp account. HC-3 consumes this as EXPO_PUBLIC_WIKI_URL.
site_url: https://seekuplift.github.io/help-center-wiki/

# Build output goes to site/ (the MkDocs default). Both site/ and .venv/ are
# gitignored — see .gitignore.
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  custom_dir: overrides
  font:
    text: DM Sans
    code: DM Mono
  palette:
    # Dark-first, matching the app. No light/dark toggle — a toggle would
    # persist to localStorage, which is unreliable in the incognito WebView.
    scheme: slate
    primary: black
    accent: teal
  features:
    - navigation.top
    - navigation.footer
    - navigation.sections
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

copyright: Seek Uplift — public test help center. No promises.

# No `plugins:` key — accept MkDocs' default, which includes the built-in
# `search` plugin. Search is client-side (lunr, generated at build time) and
# needs no cookies, no network calls at render time, and no auth, so it is
# safe in the app's incognito WebView. The `search.suggest` theme feature
# above depends on this plugin being present.

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Using the app:
    - Getting started: getting-started.md
    - Wallets: wallets.md
    - Account: account.md
    - Buy and sell: trading.md
    - Discover and callouts: callouts.md
    - Communities: communities.md
  - Launching:
    - Launch a coin: launching.md
    - Fees: fees.md
    - Graduation: graduation.md
    - Creators: creators.md
  - Help:
    - Getting help: support.md
    - Privacy and safety: privacy.md
    - FAQ: faq.md
